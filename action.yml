name: giskard
description: "Validate a repo against zeroth universal rules"
author: Malstrom

inputs:
  repo:
    description: "Path to the repo to validate (default: current directory)"
    required: false
    default: "."
  framework:
    description: "Optional framework-specific checks (e.g. dojo, aurora)"
    required: false
    default: ""
  mode:
    description: "Validation mode: 'instance' (default) or 'zeroth'"
    required: false
    default: "instance"
  github-token:
    description: "GitHub token to open issues on failure and post PR comment"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Checkout giskard
      uses: actions/checkout@v4
      with:
        repository: Malstrom/giskard
        path: _giskard

    - name: Run giskard
      shell: bash
      env:
        GISKARD_REPO: ${{ inputs.repo }}
        GISKARD_FRAMEWORK: ${{ inputs.framework }}
        GISKARD_MODE: ${{ inputs.mode }}
        GISKARD_TOKEN: ${{ inputs.github-token }}
      run: |
        REPO_ABS=$(realpath "$GISKARD_REPO")
        ARGS="--repo $REPO_ABS --mode $GISKARD_MODE"
        if [ -n "$GISKARD_FRAMEWORK" ]; then
          ARGS="$ARGS --framework $GISKARD_FRAMEWORK"
        fi
        if [ -n "$GISKARD_TOKEN" ]; then
          ARGS="$ARGS --github-token $GISKARD_TOKEN"
        fi
        python _giskard/giskard.py $ARGS
        echo "GISKARD_REPORT_PATH=$REPO_ABS/giskard-report.md" >> $GITHUB_ENV

    - name: Post report as PR comment
      if: always() && inputs.github-token != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        REPORT="${GISKARD_REPORT_PATH:-$GITHUB_WORKSPACE/giskard-report.md}"
        if [ ! -f "$REPORT" ]; then
          echo "No report file found at $REPORT, skipping comment."
          exit 0
        fi
        BODY=$(cat "$REPORT")
        PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
        curl -s -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
          -d "$PAYLOAD"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: giskard-report-${{ inputs.framework || 'universal' }}-${{ inputs.mode }}
        path: ${{ env.GISKARD_REPORT_PATH }}
        if-no-files-found: ignore
