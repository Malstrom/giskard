name: giskard
description: Validate a repo against zeroth universal rules
author: Malstrom

inputs:
  repo:
    description: Path to the repo to validate (default: current directory)
    required: false
    default: "."
  framework:
    description: Optional framework-specific checks (e.g. dojo, aurora, tensho)
    required: false
    default: ""
  github-token:
    description: GitHub token to open issues on failure
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Checkout giskard
      uses: actions/checkout@v4
      with:
        repository: Malstrom/giskard
        path: _giskard

    - name: Run giskard
      shell: bash
      run: |
        ARGS="--repo ${{ inputs.repo }}"
        if [ -n "${{ inputs.framework }}" ]; then
          ARGS="$ARGS --framework ${{ inputs.framework }}"
        fi
        if [ -n "${{ inputs.github-token }}" ]; then
          ARGS="$ARGS --github-token ${{ inputs.github-token }}"
        fi
        python _giskard/giskard.py $ARGS

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: giskard-report
        path: giskard-report.md
        if-no-files-found: ignore
