# GitHub Action definition for giskard
# Use this in your framework repo to validate on every push/PR
#
# Example usage in .github/workflows/validate.yml:
#   - uses: Malstrom/giskard@main
#     with:
#       framework: dojo
#       zeroth-ref: v1.0.0   # optional — pin to a tag or SHA

name: giskard
description: Validate a Malstrom framework repo against zeroth rules
author: Malstrom

inputs:
  framework:
    description: Framework name (e.g. dojo, tensho, sudo-hire-me)
    required: true
  zeroth-ref:
    description: Git ref (tag, SHA, branch) for zeroth checklist. Default: main.
    required: false
    default: main

outputs:
  report-file:
    description: Path to the generated giskard-report.md
    value: ${{ github.workspace }}/giskard-report.md

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Run giskard validator
      shell: bash
      run: |
        python ${{ github.action_path }}/giskard.py \
          --framework ${{ inputs.framework }} \
          --repo ${{ github.workspace }} \
          --zeroth-ref ${{ inputs.zeroth-ref }}

    - name: Upload giskard report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: giskard-report
        path: ${{ github.workspace }}/giskard-report.md
        if-no-files-found: warn
