# .agent.yml
# AI-only operational manifest. Not for humans.
# Read this at the start of every session. Single entry point.
# Spec: github.com/Malstrom/zeroth
# Scenarios and procedures: github.com/Malstrom/zeroth/.scenarios.yml

# ---------------------------------------------------------------------------
# CONNECTOR CHECK
# ---------------------------------------------------------------------------
connector_check:
  on_fail: |
    Say: "GitHub connector not active. Click + → GitHub → new chat."
    Stop immediately. Do not fall back to web or browser.

# ---------------------------------------------------------------------------
# GLOBAL
# ---------------------------------------------------------------------------
global:
  language: Italian
  pr_strategy: batch_per_session
  merge_strategy: squash
  trigger_matching: pattern_first

# ---------------------------------------------------------------------------
# REPO MAP
# ---------------------------------------------------------------------------
repo_map:
  giskard.py: main validator script — CLI entry point
  core.py: proxy registry and report engine
  checks/frameworks/: one Python module per framework
  checks/frameworks/README.yml: how to add a new checker (read this first)
  action.yml: GitHub Action definition

# ---------------------------------------------------------------------------
# FILE ACCESS
# ---------------------------------------------------------------------------
file_access:
  .agent.yml: read-only
  giskard.py: read-write
  core.py: read-write
  checks/: read-write
  action.yml: read-write

# ---------------------------------------------------------------------------
# TOOL APPROVAL
# ---------------------------------------------------------------------------
tool_approval:
  feature_branch: false
  file_edit: false
  push_files: false
  create_pr: false
  merge_to_main: false
  delete_file: true
  destructive_ops: true

# ---------------------------------------------------------------------------
# WRITE-AHEAD
# ---------------------------------------------------------------------------
write_ahead:
  rule: commit before responding
  branch_strategy: |
    NEVER push directly to main.
    Always: feature branch → PR → squash merge.
    Branch naming: {type}/{short-description}
    Types: feat, fix, docs, test, chore
